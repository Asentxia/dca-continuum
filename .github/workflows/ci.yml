name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact merge candidate parents
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
            test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          else
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          fi

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/audit /tmp/gitleaks
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks/gitleaks.tar.gz' | sha256sum --check -
          tar -xzf /tmp/gitleaks/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Scan current source
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks dir \
            --redact \
            --no-banner \
            --gitleaks-ignore-path .gitleaksignore \
            --report-format json \
            --report-path .artifacts/audit/gitleaks-source.json \
            .

      - name: Scan reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks git \
            --redact \
            --no-banner \
            --gitleaks-ignore-path .gitleaksignore \
            --report-format json \
            --report-path .artifacts/audit/gitleaks-history.json \
            .

      - name: Upload redacted scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: secret-scan-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/audit/gitleaks-*.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  canonical:
    # Draft imports run the bounded pilot; ready PRs retain full verification.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Canonical local verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CT_PG_BIN: /usr/lib/postgresql/17/bin

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact merge candidate parents
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
            test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          else
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          fi

      - name: Install Node 22 for frontend
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3

      - name: Record separate Node 22 binary
        shell: bash
        run: |
          set -euo pipefail
          echo "CT_NODE22_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          node --version

      - name: Install Node 24 for backend
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1

      - name: Install PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17 python3 openssl
          "$CT_PG_BIN/postgres" --version
          "$CT_PG_BIN/initdb" --version

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$("$CT_NODE22_BIN/node" -p 'process.versions.node.split(".")[0]')" = 22
          npm ci --ignore-scripts

      - name: Install Chromium and system browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          CHROMIUM_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")"
          test -x "$CHROMIUM_PATH"
          echo "CT_CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Prepare pinned native integration toolchain and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v rustup
          rustup toolchain install 1.94.0 --profile minimal
          NATIVE_BIN="$(dirname "$(rustup which --toolchain 1.94.0 rustc)")"
          "$NATIVE_BIN/rustc" --version
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          "$NATIVE_BIN/cargo" fetch --locked --manifest-path tools/nexus-native/Cargo.toml
          echo "NEXUS_TOOLCHAIN_BIN=$NATIVE_BIN" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"

      - name: Local launcher safety tests (no database mutation)
        run: python3 -m unittest discover -s tools -p test_local_test.py

      - name: Format check
        run: npm run format:check

      - name: Dependency audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/audit
          npm audit --omit=dev --json > .artifacts/audit/npm-audit-production.json
          npm audit --json > .artifacts/audit/npm-audit-complete.json

      - name: Install the root-owned fixture privilege helper
        shell: bash
        run: |
          set -euo pipefail
          sudo CT_FIXTURE_NODE="$(command -v node)" bash tools/install-fixture-priv.sh

      - name: Let the unprivileged fixture uid read the workspace
        shell: bash
        run: |
          set -euo pipefail
          chmod o+x "$HOME" "$HOME/work" "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"
          chmod -R a+rX "$GITHUB_WORKSPACE"

      - name: Run guarded canonical verification
        shell: bash
        env:
          CT_RESET_LOCAL_FIXTURE: "yes"
          CT_RESET_CONSOLE_FIXTURE: "yes"
        run: |
          set -euo pipefail
          npm run test:canonical

      - name: Confirm production gates remain blocked
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run qualification-check > .artifacts/audit/qualification-check.log 2>&1
          q=$?
          npm run release-check > .artifacts/audit/release-check.log 2>&1
          r=$?
          set -e
          test "$q" -eq 1
          test "$r" -eq 1
          echo "Qualification and release enforcement remain intentionally blocked."

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: canonical-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/canonical/final/**
            .artifacts/implementation/final/**
            .artifacts/audit/**
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

  import-preflight:
    name: Draft import capability and dependency pilot
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up frontend Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
      - name: Record frontend binary
        run: echo "CT_NODE22_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Set up backend Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
      - name: Record source identity and capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/import-pilot
          git rev-parse HEAD HEAD^{tree} > .artifacts/import-pilot/GIT-IDENTITY.txt
          git status --porcelain --untracked-files=no > .artifacts/import-pilot/SOURCE-STATUS.txt
          git merge-base --is-ancestor 800091f08ce1eb8843813a8d48f681cd6a3ad5df HEAD
          python3 tools/canonical-source-digest.py > .artifacts/import-pilot/TESTED-SOURCE.json
          python3 tools/nexus-verify-provenance.py > .artifacts/import-pilot/SOURCE-PROVENANCE.txt
          test "$(node --version)" = v24.14.1
          test "$("$CT_NODE22_BIN/node" --version)" = v22.23.3
          python3 -c 'import sys; assert sys.version_info >= (3,11)'
          command -v rustup
          command -v ip
          sudo -n true
          sudo unshare --mount --net true
          printf 'Pilot only; PostgreSQL/native canonical profile still requires qualification.\n' > .artifacts/import-pilot/SCOPE.txt
      - name: Install locked dependencies without lifecycle scripts
        id: dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          browser=$(node -p "require('playwright').chromium.executablePath()")
          printf 'CT_CHROMIUM_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Prove real browser offline transitions in an isolated local network
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- /bin/bash -euo pipefail -c '
            test "$(readlink /proc/self/ns/net)" != "$(readlink /proc/1/ns/net)"
            python3 -c '\''import socket; assert {n for _,n in socket.if_nameindex()} == {"lo"}'\''
            ip link set lo up
            ip link add ct-ci-a type veth peer name ct-ci-b
            ip addr add 192.0.2.1/30 dev ct-ci-a
            ip addr add 192.0.2.2/30 dev ct-ci-b
            ip link set ct-ci-a up
            ip link set ct-ci-b up
            test -z "$(ip route show default)"
            ip -j address show > .artifacts/import-pilot/NAMESPACE-ADDRESSES.json
            /usr/sbin/runuser -u "$1" -- /usr/bin/env -i HOME="$3" PATH="$(dirname "$2"):/usr/bin:/bin" CT_CHROMIUM_PATH="$4" "$2" tools/ci/browser-network-preflight.mjs
          ' -- "$(id -un)" "$(command -v node)" "$HOME" "$CT_CHROMIUM_PATH" > .artifacts/import-pilot/BROWSER-PRECONDITION.json
      - name: Capture actual production and complete dependency audits
        if: always() && steps.dependencies.outcome == 'success'
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > .artifacts/import-pilot/DEPENDENCY-AUDIT-PRODUCTION.json
          production=$?
          npm audit --json > .artifacts/import-pilot/DEPENDENCY-AUDIT-COMPLETE.json
          complete=$?
          printf '{"productionExit":%s,"completeExit":%s}\n' "$production" "$complete" > .artifacts/import-pilot/DEPENDENCY-AUDIT-EXITS.json
          test "$production" -eq 0 && test "$complete" -eq 0
      - name: Confirm source stayed unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/canonical-source-digest.py > .artifacts/import-pilot/SOURCE-AFTER.json
          cmp .artifacts/import-pilot/TESTED-SOURCE.json .artifacts/import-pilot/SOURCE-AFTER.json
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload bounded pilot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: import-pilot-${{ github.event.pull_request.head.sha }}
          path: .artifacts/import-pilot/*
          if-no-files-found: warn
          retention-days: 7

  merge-gate:
    name: Merge verification gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [canonical, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require actual success, never skipped verification
        env:
          CANONICAL_RESULT: ${{ needs.canonical.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          test "$CANONICAL_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
